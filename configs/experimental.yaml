paths:
  train_data: data/extended
  test_data: data/test
  casestudy_data: data/casestudy
  pretrained_models: models/pretrained
  checkpoints: models/checkpoints
  runs: runs/experimental

# Shared adjoint-gradient normalization, used by U-Net pretraining, SegFormer
# pretraining and every downstream FWI experiment. One setting for all models so
# the architecture comparison is not confounded by preprocessing.
#   robust_abs : sign-preserving divide by the `quantile` of |gradient|, clamped
#   minmax     : legacy per-sample [min,max] -> [-1,1] affine map
gradient_normalization:
  mode: robust_abs
  quantile: 0.99
  eps: 1.0e-08
  clamp: 1.0

simulation:
  Lx: 0.1
  Ly: 0.05
  Nx: 255
  Ny: 127
  dt: 3.0e-08
  N: 2000
  gamma0: 1.0e-05
  rho: 2700
  c: 6000
  numberOfSources: 4
  distanceBetweenSources: 36
  distanceBetweenSensors: 6

source:
  frequency: 500000
  cycles: 2
  amplitude: 1.0e+12

data_generation:
  seed: 2
  train:
    number_of_cases: 9000
    number_of_damages: 1
    factor_to_avoid_inverse_crime: 2
  test:
    number_of_cases: 2
    number_of_damages: 1
    factor_to_avoid_inverse_crime: 2

models:
  unet:
    channels: [1, 16, 32, 64, 128]
    number_of_convolutions_per_block: 2
    batch_norm: true
  segformer:
    in_channels: 1
    # MiT-B0 widths. Measured on this GPU: 1.84x the parameters of the
    # previous [24,48,96,192] spec but 0.91x the step time (109 vs 119 ms
    # per batch-16 step) -- multiples of 32 map better onto tensor cores.
    # These are also the ONLY widths that accept ImageNet MiT-B0 weights.
    hidden_sizes: [32, 64, 160, 256]
    depths: [2, 2, 2, 2]
    num_attention_heads: [1, 2, 5, 8]
    sr_ratios: [8, 4, 2, 1]
    patch_sizes: [7, 3, 3, 3]
    strides: [4, 2, 2, 2]
    mlp_ratios: [4, 4, 4, 4]
    decoder_hidden_size: 64
    hidden_dropout_prob: 0.0
    attention_probs_dropout_prob: 0.0
    classifier_dropout_prob: 0.0
    drop_path_rate: 0.0
  # PREVIOUS narrowed spec, kept so the old runs can be reproduced:
  # select with --models segformer_narrow where a script supports it.
  segformer_narrow:
  #   in_channels: 1
  #   hidden_sizes: [24, 48, 96, 192]
  #   depths: [2, 2, 2, 2]
  #   num_attention_heads: [1, 2, 4, 8]
  #   sr_ratios: [8, 4, 2, 1]
  #   patch_sizes: [7, 3, 3, 3]
  #   strides: [4, 2, 2, 2]
  #   mlp_ratios: [4, 4, 4, 4]
  #   decoder_hidden_size: 64
  #   hidden_dropout_prob: 0.0
  #   attention_probs_dropout_prob: 0.0
  #   classifier_dropout_prob: 0.0
  #   drop_path_rate: 0.0

pretraining:
  seed: 30
  split_seed: 2
  numberOfSamples: 800
  availableSamples: 800
  trainingType: supervised
  model_type: Unet
  NNchannels: [1, 16, 32, 64, 128]
  numberOfConvolutionsPerBlock: 2
  batchDivisor: 10
  lr: 5.0e-04
  alpha: -0.5
  beta: 0.2
  epochs: 100
  clipGrad: 5.0e-04
  l2: 1.0e-06
  costScaling: 1.0e+08

segformer_pretraining:
  # Same objective as the U-Net (MSE on the continuous gamma field), so
  # the head-to-head comparison isolates architecture. 'bce_dice' restores
  # the original weighted-BCE + soft-Dice segmentation objective.
  objective: mse
  seed: 30
  split_seed: 2
  numberOfSamples: 800
  availableSamples: 800
  trainingType: segmentation
  model_type: SegFormer
  batch_size: 4
  lr: 3.0e-04
  weight_decay: 1.0e-04
  scheduler: cosine
  epochs: 100
  clipGrad: 1.0
  dice_weight: 1.0
  bce_pos_weight: auto
  void_gamma_threshold: 0.5
  eval_threshold: 0.5
  void_prior: 0.01
  gradient_normalization:
    mode: robust_abs
    quantile: 0.99
    eps: 1.0e-08
    clamp: 1.0

experiments:
  cases: [1, 2, 3, 4]
  pretrain_samples: [800]
  epochs_pretrain: 100
  modelType: Unet
  NNchannels: [1, 16, 32, 64, 128]
  numberOfConvolutionsPerBlock: 2

  conventional_fwi:
    lr: 8.0e-02
    alpha: 0.0
    beta: 0.0
    weightLrFactor: 1
    clipGrad: 1.0e-05
    epochs: 35
    costScaling: 1.0e+12

  conventional_fwi_initial_guess:
    seed: 99
    pretrain_samples: 800
    lr: 5.0e-02
    alpha: 0.0
    beta: 0.0
    weightLrFactor: 1
    clipGrad: 1.0e-05
    epochs: 35
    costScaling: 1.0e+12

  nn_based_fwi:
    seed: 50
    input_shape: [1, 128, 8, 4]
    trunc_normal_mean: 0.4
    trunc_normal_std: 0.2
    trunc_normal_a: 0.0
    trunc_normal_b: 0.9
    lr: 5.0e-04
    alpha: -0.5
    beta: 0.2
    epochs: 35
    l2: 1.0e-06
    costScaling: 1.0e+09

  inr_fwi:
    seed: 50
    hidden_features: 128
    hidden_layers: 4
    output_mode: direct_gamma
    final_bias: 3.0
    lr: 1.0e-03
    alpha: -0.5
    beta: 0.2
    epochs: 35
    tv_weight: 0.0
    tv_type: anisotropic
    l2: 1.0e-06
    costScaling: 1.0e+11

  inr_siren_fwi:
    seed: 50
    hidden_features: 128
    hidden_layers: 4
    omega0: 30
    output_mode: direct_gamma
    final_bias: 3.0
    lr: 3.0e-04
    alpha: -0.5
    beta: 0.2
    epochs: 35
    tv_weight: 0.0
    tv_type: anisotropic
    l2: 1.0e-06
    costScaling: 1.0e+11

  inr_siren_centered_fwi:
    seed: 50
    lr_bias: 1.0      # one shared scalar: needs a far larger rate than the network
    learnable_bias: true     # centring mean is a Parameter, not a pinned buffer
    hidden_features: 128
    hidden_layers: 4
    omega0: 30
    output_mode: direct_gamma
    final_bias: 3.0
    lr: 3.0e-04
    alpha: -0.5
    beta: 0.2
    epochs: 35
    tv_weight: 0.0
    tv_type: anisotropic
    l2: 1.0e-06
    costScaling: 1.0e+11

  inr_lr_fwi:
    seed: 50
    # r_x, r_y = half the model dimension per axis (R13 App. B.1; R14 uses
    # r1=50, r2=100). Domain is 256 x 128, so 128 and 64.
    rank_x: 128
    rank_y: 64
    hidden_features: 128
    hidden_layers: 3
    omega0: 30
    core_init_std: 1.0e-03
    output_mode: direct_gamma
    final_bias: 3.0
    lr: 3.0e-04
    alpha: -0.5
    beta: 0.2
    epochs: 35
    tv_weight: 0.0
    tv_type: anisotropic
    l2: 1.0e-06
    costScaling: 1.0e+11

  inr_mpe_fwi:
    seed: 50
    num_levels: 16
    base_resolution: 50
    per_level_scale: 1.05
    features_per_level: 2
    hidden_features: 64
    hidden_layers: 2
    grid_init_std: 1.0e-03
    align_corners: true
    swap_grid_coords: false
    # feature-grid H/W; (Ny+1)/(Nx+1) keeps grid cells square
    grid_aspect: 0.5
    output_mode: direct_gamma
    final_bias: 3.0
    lr: 3.0e-02
    alpha: -0.5
    beta: 0.2
    epochs: 35
    tv_weight: 0.0
    tv_type: anisotropic
    l2: 1.0e-06
    costScaling: 1.0e+11

  inr_mpe_centered_fwi:
    seed: 50
    lr_bias: 1.0      # one shared scalar: needs a far larger rate than the network
    learnable_bias: true     # centring mean is a Parameter, not a pinned buffer
    num_levels: 16
    base_resolution: 50
    per_level_scale: 1.05
    features_per_level: 2
    hidden_features: 64
    hidden_layers: 2
    grid_init_std: 1.0e-02
    align_corners: true
    swap_grid_coords: false
    # feature-grid H/W; (Ny+1)/(Nx+1) keeps grid cells square
    grid_aspect: 0.5
    output_mode: direct_gamma
    final_bias: 4.0
    lr: 3.0e-02
    alpha: -0.5
    beta: 0.2
    epochs: 35
    tv_weight: 0.0
    tv_type: anisotropic
    l2: 1.0e-06
    costScaling: 1.0e+11

  inr_ig_fwi:
    seed: 50
    lr_fusion: 3.0e-04
    lr_siren: 3.0e-04  # SIREN branch behaves like IFWI; 100x lower than the grid
    lr_grid: 1.0e-01  # grid branch behaves like MPE-FWI
    feature_norm: true     # unit-RMS the fused vector before the fusion MLP
    fusion_init_std: 1.0      # was hardcoded 1e-3, which left gamma ~1000x too flat
    fusion_alpha: 0.5      # R13 §6.4: "typically set to 0.5" (was 0.8)
    num_levels: 16
    base_resolution: 50
    per_level_scale: 1.05
    features_per_level: 2
    grid_init_std: 1.0e-01  # brings grid features to parity with SIREN's
    align_corners: true
    swap_grid_coords: false
    # feature-grid H/W; (Ny+1)/(Nx+1) keeps grid cells square
    grid_aspect: 0.5
    siren_hidden_features: 128
    siren_hidden_layers: 2
    siren_out_features: 128
    omega0: 30
    fusion_hidden_features: 64
    fusion_hidden_layers: 2
    output_mode: direct_gamma
    final_bias: 3.0      # matches the other INRs (was 4.5)
    # base lr: only a fallback -- lr_grid/lr_siren/lr_fusion above override it
    lr: 3.0e-04
    alpha: -0.5
    beta: 0.2
    epochs: 35
    tv_weight: 0.0
    tv_type: anisotropic
    l2: 1.0e-06
    costScaling: 1.0e+11

  inr_ig_centered_fwi:
    seed: 50
    lr_bias: 1.0      # one shared scalar: needs a far larger rate than the network
    learnable_bias: true     # centring mean is a Parameter, not a pinned buffer
    lr_fusion: 3.0e-04
    lr_siren: 3.0e-04  # SIREN branch behaves like IFWI; 100x lower than the grid
    lr_grid: 1.0e-01  # grid branch behaves like MPE-FWI
    feature_norm: true     # unit-RMS the fused vector before the fusion MLP
    fusion_init_std: 1.0      # was hardcoded 1e-3, which left gamma ~1000x too flat
    fusion_alpha: 0.5      # R13 §6.4: "typically set to 0.5" (was 0.8)
    num_levels: 16
    base_resolution: 50
    per_level_scale: 1.05
    features_per_level: 2
    grid_init_std: 1.0e-01  # brings grid features to parity with SIREN's
    align_corners: true
    swap_grid_coords: false
    # feature-grid H/W; (Ny+1)/(Nx+1) keeps grid cells square
    grid_aspect: 0.5
    siren_hidden_features: 128
    siren_hidden_layers: 2
    siren_out_features: 128
    omega0: 30
    fusion_hidden_features: 64
    fusion_hidden_layers: 2
    output_mode: direct_gamma
    final_bias: 3.0      # matches the other INRs (was 4.5)
    # base lr: only a fallback -- lr_grid/lr_siren/lr_fusion above override it
    lr: 3.0e-04
    alpha: -0.5
    beta: 0.2
    epochs: 35
    tv_weight: 0.0
    tv_type: anisotropic
    l2: 1.0e-06
    costScaling: 1.0e+11

  transfer_learning_fwi:
    seed: 99
    lr: 5.0e-04
    alpha: -0.5
    beta: 0.2
    epochs: 15
    restore_best_observed: true
    clipGrad: 5.0e-05
    l2: 1.0e-06
    costScaling: 1.0e+10

  transfer_learning_fwi_frozen_encoder:
    seed: 99
    # encoder | decoder | random_encoder | none
    #   encoder        : freeze down path + bottleneck (the usual advice)
    #   decoder        : the reverse -- Amiri et al.'s better direction
    #   random_encoder : CONTROL for Raghu/Karimi -- randomly re-init the
    #                    encoder, freeze it, train only the decoder. If this
    #                    matches a frozen pretrained encoder, what transfers
    #                    is not the learned features.
    #   none           : full fine-tuning baseline
    freeze_mode: encoder
    lr: 5.0e-04
    alpha: -0.5
    beta: 0.2
    # 15, matching transfer_learning_fwi and transfer_segformer_fwi.
    # At 5 epochs most configurations barely move off the trivial
    # solution, so the four freeze modes would land within noise of
    # each other -- and encoder vs random_encoder is exactly the
    # comparison this ablation needs to resolve. Matching the other
    # transfer experiments also makes the numbers directly comparable.
    epochs: 15
    clipGrad: 5.0e-05
    l2: 1.0e-06
    costScaling: 1.0e+10

  transfer_segformer_fwi:
    seed: 99
    pretrained_checkpoint: model_SegFormer_100_segmentation_800.pt
    trainable_mode: all
    lr: 3.0e-04
    weight_decay: 1.0e-04
    alpha: -0.5
    beta: 0.2
    epochs: 15
    restore_best_observed: true
    clipGrad: 1.0
    l2: 1.0e-06
    costScaling: 1.0e+11
