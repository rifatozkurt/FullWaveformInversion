paths:
  train_data: data/train
  test_data: data/test
  casestudy_data: data/casestudy
  pretrained_models: models/pretrained
  checkpoints: models/checkpoints
  runs: runs/long_run_centered

simulation:
  Lx: 0.1
  Ly: 0.05
  Nx: 255
  Ny: 127
  dt: 3.0e-08
  N: 2000
  gamma0: 1.0e-05
  rho: 2700
  c: 6000
  numberOfSources: 4
  distanceBetweenSources: 36
  distanceBetweenSensors: 6

source:
  frequency: 500000
  cycles: 2
  amplitude: 1.0e+12

data_generation:
  seed: 2
  train:
    number_of_cases: 5
    number_of_damages: 1
    factor_to_avoid_inverse_crime: 2
  test:
    number_of_cases: 2
    number_of_damages: 1
    factor_to_avoid_inverse_crime: 2

models:
  unet:
    channels: [1, 16, 32, 64, 128]
    number_of_convolutions_per_block: 2
    batch_norm: true

pretraining:
  seed: 30
  split_seed: 2
  numberOfSamples: 800
  availableSamples: 800
  trainingType: supervised
  model_type: Unet
  NNchannels: [1, 16, 32, 64, 128]
  numberOfConvolutionsPerBlock: 2
  batchDivisor: 10
  lr: 5.0e-04
  alpha: -0.5
  beta: 0.2
  epochs: 100
  clipGrad: 5.0e-04
  l2: 1.0e-06
  costScaling: 1.0e+08

experiments:
  cases: [1, 4]
  pretrain_samples: [800]
  epochs_pretrain: 100
  modelType: Unet
  NNchannels: [1, 16, 32, 64, 128]
  numberOfConvolutionsPerBlock: 2

  conventional_fwi:
    lr: 8.0e-02
    alpha: 0.0
    beta: 0.0
    weightLrFactor: 1
    clipGrad: 1.0e-05
    epochs: 35
    costScaling: 1.0e+12

  conventional_fwi_initial_guess:
    seed: 99
    pretrain_samples: 800
    lr: 5.0e-02
    alpha: 0.0
    beta: 0.0
    weightLrFactor: 1
    clipGrad: 1.0e-05
    epochs: 35
    costScaling: 1.0e+12

  nn_based_fwi:
    seed: 50
    input_shape: [1, 128, 8, 4]
    trunc_normal_mean: 0.4
    trunc_normal_std: 0.2
    trunc_normal_a: 0.0
    trunc_normal_b: 0.9
    lr: 5.0e-04
    alpha: -0.5
    beta: 0.2
    epochs: 35
    l2: 1.0e-06
    costScaling: 1.0e+09

  inr_fwi:
    seed: 50
    hidden_features: 128
    hidden_layers: 4
    output_mode: voidness
    final_bias: -5.0
    lr: 1.0e-04
    alpha: -0.5
    beta: 0.2
    epochs: 35
    tv_weight: 0.0
    tv_type: anisotropic
    l2: 1.0e-06
    costScaling: 1.0e+09

  inr_siren_fwi:
    seed: 50
    hidden_features: 128
    hidden_layers: 4
    omega0: 30
    output_mode: voidness
    final_bias: -5.0
    lr: 1.0e-04
    alpha: -0.5
    beta: 0.2
    epochs: 35
    clipGrad: 5.0e-05
    tv_weight: 0.0
    tv_type: anisotropic
    l2: 1.0e-06
    costScaling: 1.0e+09

  inr_siren_centered_fwi:
    seed: 50
    hidden_features: 128
    hidden_layers: 4
    omega0: 30
    output_mode: voidness
    final_bias: -5.0
    lr: 1.0e-04
    alpha: -0.5
    beta: 0.2
    epochs: 500
    clipGrad: 5.0e-05
    tv_weight: 0.0
    tv_type: anisotropic
    l2: 1.0e-06
    costScaling: 1.0e+09

  inr_lr_fwi:
    seed: 50
    rank: 32
    hidden_features: 128
    hidden_layers: 3
    omega0: 30
    core_init_std: 1.0e-03
    output_mode: voidness
    final_bias: -5.0
    lr: 1.0e-04
    alpha: -0.5
    beta: 0.2
    epochs: 150
    tv_weight: 0.0
    tv_type: anisotropic
    l2: 1.0e-06
    costScaling: 1.0e+09

  inr_mpe_fwi:
    seed: 50
    num_levels: 16
    base_resolution: 50
    per_level_scale: 1.05
    features_per_level: 2
    hidden_features: 64
    hidden_layers: 2
    grid_init_std: 1.0e-04
    align_corners: true
    swap_grid_coords: false
    output_mode: voidness
    final_bias: -5.0
    lr: 1.0e-04
    alpha: -0.5
    beta: 0.2
    epochs: 500
    tv_weight: 0.0
    tv_type: anisotropic
    l2: 1.0e-06
    costScaling: 1.0e+09

  inr_mpe_centered_fwi:
    seed: 50
    num_levels: 16
    base_resolution: 50
    per_level_scale: 1.05
    features_per_level: 2
    hidden_features: 64
    hidden_layers: 2
    grid_init_std: 1.0e-02
    align_corners: true
    swap_grid_coords: false
    output_mode: voidness
    final_bias: -5.0
    lr: 1.0e-04
    alpha: -0.5
    beta: 0.2
    epochs: 500
    tv_weight: 0.0
    tv_type: anisotropic
    l2: 1.0e-06
    costScaling: 1.0e+09

  inr_ig_fwi:
    seed: 50
    fusion_alpha: 0.5
    num_levels: 16
    base_resolution: 50
    per_level_scale: 1.05
    features_per_level: 2
    grid_init_std: 1.0e-04
    align_corners: true
    swap_grid_coords: false
    siren_hidden_features: 128
    siren_hidden_layers: 2
    siren_out_features: 128
    omega0: 30
    fusion_hidden_features: 64
    fusion_hidden_layers: 2
    output_mode: voidness
    final_bias: -5.0
    lr: 1.0e-04
    alpha: -0.5
    beta: 0.2
    epochs: 500
    tv_weight: 0.0
    tv_type: anisotropic
    l2: 1.0e-06
    costScaling: 1.0e+09

  inr_ig_centered_fwi:
    seed: 50
    fusion_alpha: 0.5
    num_levels: 16
    base_resolution: 50
    per_level_scale: 1.05
    features_per_level: 2
    grid_init_std: 1.0e-02
    align_corners: true
    swap_grid_coords: false
    siren_hidden_features: 128
    siren_hidden_layers: 2
    siren_out_features: 128
    omega0: 30
    fusion_hidden_features: 64
    fusion_hidden_layers: 2
    output_mode: voidness
    final_bias: -5.0
    lr: 1.0e-04
    alpha: -0.5
    beta: 0.2
    epochs: 500
    tv_weight: 0.0
    tv_type: anisotropic
    l2: 1.0e-06
    costScaling: 1.0e+09

  transfer_learning_fwi:
    seed: 99
    lr: 5.0e-04
    alpha: -0.5
    beta: 0.2
    epochs: 5
    clipGrad: 5.0e-05
    l2: 1.0e-06
    costScaling: 1.0e+10

  transfer_learning_fwi_frozen_encoder:
